<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV 특정 열 추출기 | 작은도구함</title><meta name="description" content="CSV 파일에서 필요한 열만 선택하여 다운로드"><link rel="canonical" href="https://csv-column-extractor.abreda.com/ko/"><link rel="alternate" hreflang="ko" href="https://csv-column-extractor.abreda.com/ko/"><link rel="alternate" hreflang="en" href="https://csv-column-extractor.abreda.com/en/"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:880px;margin:auto;padding:20px;color:#192538;background:#f7f9fc}header,section{background:white;border:1px solid #e0e6ef;border-radius:12px;padding:20px;margin-bottom:16px}h1{line-height:1.25}textarea{display:block;box-sizing:border-box;width:100%;min-height:160px;margin:8px 0 16px;padding:12px;border:1px solid #abb8c8;border-radius:8px;font:14px/1.5 monospace}button{padding:10px 16px;border:0;border-radius:7px;background:#1559a6;color:white;margin:6px 8px 6px 0;cursor:pointer}#columns{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}a{color:#1559a6}small{color:#596579}</style></head><body data-tool="csv-column-extractor"><header><a href="https://abreda.com/">Small Toolbox</a>　<a href="/ko/">한국어</a>　<a href="/en/">English</a></header><main><h1>CSV 특정 열 추출기</h1><p>CSV 파일에서 필요한 열만 선택하여 다운로드</p><section><label for="file">파일 선택</label><input id="file" type="file"><label for="source"><p>원본 텍스트</p></label><textarea id="source" spellcheck="false"></textarea><div id="columns"></div><button id="run">처리하기</button><p id="status" role="status" aria-live="polite"></p><label for="output">결과</label><textarea id="output" readonly></textarea><button id="download">다운로드</button><button id="copy">복사</button></section><section><h2>사용 방법</h2><p>파일을 선택하거나 내용을 붙여넣은 후 처리 버튼을 누르고 결과를 다운로드하세요.</p><h2>FAQ</h2><h3>파일이 서버에 올라가나요?</h3><p>아니요. 브라우저 안에서 처리됩니다.</p><h3>결과가 정확한가요?</h3><p>중요한 자료는 원본과 대조하세요.</p></section></main><script>
const kind=document.body.dataset.tool;
let name='result',outExt='txt';
const $=id=>document.getElementById(id);
function csvParse(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c;}else if(c==='"'&&v==='')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('Unclosed quoted field');if(row.length||v!==''){row.push(v);rows.push(row)}return rows}
function csvWrite(rows){return rows.map(r=>r.map(x=>/[",\r\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(',')).join('\r\n')}
function columns(){try{let r=csvParse($('source').value),h=r[0]||[];$('columns').replaceChildren(...h.map((v,i)=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=i;c.checked=true;l.append(c,document.createTextNode(' '+(v||'Column '+(i+1))));return l}))}catch(e){$('status').textContent=e.message}}
function srt(s){return s.replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.split('\n').filter(x=>!(/^\d+$/.test(x.trim())||/^\d{2}:\d{2}:\d{2}[,.]\d+\s*-->/.test(x))).map(x=>x.replace(/\[[^\]]{1,120}\]|\([^)]{1,120}\)/g,'').replace(/^\s*(?:[-–]\s*)?[\p{L}][\p{L}0-9 _-]{0,35}:\s*/u,'').replace(/<[^>]*>/g,'').trim()).filter(Boolean).join('\n')).filter(Boolean).join('\n\n')}
function vtt(s){return s.replace(/\r/g,'').split('\n').filter(x=>!(/^(WEBVTT|NOTE|STYLE|REGION)\b/.test(x.trim())||/-->/.test(x)||/^\d+$/.test(x.trim()))).map(x=>x.replace(/<v(?:\s+[^>]*)?>/gi,'').replace(/<[^>]*>/g,'').replace(/^\s*(?:[-–]\s*)?[\p{L}][\p{L}0-9 _-]{0,35}:\s*/u,'').trim()).filter(Boolean).join('\n')}
function run(){try{const s=$('source').value;if(!s.trim())throw Error('Input required');let result='',note='Done',ext='txt';if(kind==='csv-column-extractor'){let r=csvParse(s),sel=[...document.querySelectorAll('#columns input:checked')].map(x=>+x.value);if(!r.length||!sel.length)throw Error('Choose at least one column');result=csvWrite(r.map(row=>sel.map(i=>row[i]||'')));ext='csv'}else if(kind==='csv-empty-row-remover'){let r=csvParse(s),kept=r.filter(row=>row.some(x=>x.trim()));result=csvWrite(kept);note=(r.length-kept.length)+' empty rows removed';ext='csv'}else if(kind==='srt-sdh-cleaner')result=srt(s);else if(kind==='vtt-cleaner')result=vtt(s);else{let errs=[],good=0;s.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;try{JSON.parse(line);good++}catch(e){errs.push('Line '+(i+1)+': '+e.message)}});result=errs.length?errs.join('\n'):'All '+good+' lines valid';note=good+' valid, '+errs.length+' errors'}$('output').value=result;outExt=ext;$('status').textContent=note}catch(e){$('status').textContent='Error: '+e.message}}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');$('source').value=await f.text();if(kind==='csv-column-extractor')columns()};
$('source').oninput=()=>{if(kind==='csv-column-extractor')columns()};
$('run').onclick=run;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied'}catch(e){$('status').textContent='Copy unavailable'}};
$('download').onclick=()=>{let blob=new Blob(['\ufeff'+$('output').value],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+'-result.'+outExt;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
