<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101d35">
<title>내 생활 로그 | 하루한칸</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#e9eefc;background:#0b1427}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101f3a,#0b1427 55%);min-height:100vh}
main{width:min(760px,100%);margin:auto;padding:24px 16px 92px}
a{color:#a5caff;text-decoration:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.overline{color:#8da7ce;font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:27px;letter-spacing:-.7px;margin:8px 0 10px}
.sub{color:#9bacc7;margin:0;font-size:14px;line-height:1.6}
.panel{background:#14243d;border:1px solid #29405d;border-radius:18px;padding:18px;margin-top:16px}
.hero{background:linear-gradient(120deg,#20385f,#142a40)}
.chip{border:1px solid #365172;border-radius:999px;padding:9px 11px;font-size:12px}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:11px;font-weight:700}
.btn{background:#33558b;color:#fff;padding:10px 13px}
.btn:disabled{opacity:.5;cursor:wait}
.btn.secondary{background:#253958;color:#d7e9ff}
.btn.danger{background:#472938;color:#ffc3cb;padding:7px 11px;font-size:12px}
.filters{display:flex;gap:7px;margin:20px 0 6px}
.filters button{background:#1e3451;color:#aebfda;padding:9px 15px}
.filters button.active{background:#e4f1ff;color:#13243b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border-radius:15px;background:#1b3050;padding:16px;min-height:108px}
.stat .label{color:#a9bbda;font-size:12px}
.stat strong{font-size:24px;margin-top:10px;display:block;letter-spacing:-.6px}
.stat small{font-size:11px;color:#96a9c7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:17px;letter-spacing:-.2px;margin:0 0 16px}
.entry{padding:12px 0;border-bottom:1px solid #2a405d;display:flex;justify-content:space-between;gap:10px}
.entry:last-child{border-bottom:0}
.entry strong{font-size:14px;display:block}
.entry .meta{color:#a1b4d1;font-size:12px;margin-top:6px;line-height:1.45;overflow-wrap:anywhere}
.pill{display:inline-block;color:#80edc4;font-size:11px;border:1px solid #386e65;padding:3px 8px;border-radius:12px}
label{font-size:13px;color:#adc4e3;display:block;margin-top:12px}
input,select,textarea{width:100%;border:1px solid #355277;border-radius:10px;background:#101d33;color:#fff;padding:12px;outline:none;margin-top:6px}
textarea{min-height:65px;resize:vertical}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formactions{margin-top:16px;display:flex;gap:10px}
.help{color:#9cb0cc;font-size:12px;line-height:1.55}
.barwrap{display:grid;grid-template-columns:42px 1fr 44px;gap:10px;align-items:center;margin:12px 0;color:#abc1e1;font-size:12px}
.track{background:#263c5a;height:9px;overflow:hidden;border-radius:99px}
.track>div{height:100%;background:linear-gradient(90deg,#4ca7ea,#67e8c2);border-radius:99px}
#message{min-height:20px;color:#a9efce;margin-top:15px;font-size:13px}
.empty{padding:24px 0;color:#a7b9d2;text-align:center}
.hidden{display:none}
@media(min-width:630px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{min-height:112px}}
</style>
</head>
<body>
<main>
 <div class="head">
  <div><div class="overline">CHAT → RECORD → DATA</div><h1>내 생활 로그</h1><p class="sub">말한 행동만 기록하고, 기록된 사실만 통계로 보여줘.</p></div>
  <a class="chip" href="./">하루한칸 앱</a>
 </div>
 <div id="login" class="panel hidden">
  <h2>로그인이 필요해</h2><p class="sub">같은 계정으로 하루한칸 앱에 로그인한 뒤 이 화면을 열어줘.</p>
  <p><a class="btn" href="./">로그인하러 가기</a></p>
 </div>
 <div id="screen" class="hidden">
  <div class="filters"><button data-period="7">최근 7일</button><button data-period="30" class="active">최근 30일</button><button data-period="all">전체</button></div>
  <div id="stats" class="grid"></div>
  <section class="panel hero">
   <div class="row"><h2>최근 7일 기록량</h2><span class="pill">실제 입력 기준</span></div>
   <div id="bars"></div>
   <p class="help">기록하지 않은 날은 '미기록'이며 금주·운동 성공으로 자동 계산하지 않아.</p>
  </section>
  <section class="panel">
   <div class="row"><h2>기록 내역</h2><button class="btn secondary" id="refresh" type="button">새로고침</button></div>
   <div id="history"></div>
  </section>
  <section class="panel">
   <h2>직접 기록 또는 수정</h2>
   <p class="sub">채팅으로 저장한 내용도 여기서 확인할 수 있어. 직접 입력한 내용은 서버에 저장돼.</p>
   <form id="form">
    <div class="two">
     <label>날짜<input type="date" id="day" required></label>
     <label>구분<select id="kind">
      <option value="work">정상 출근</option><option value="exercise">운동</option><option value="reading">웹소설 읽기</option>
      <option value="writing">웹소설 쓰기</option><option value="no_alcohol">금주</option><option value="alcohol">음주</option>
      <option value="delivery">배달음식</option><option value="medication">약 복용</option>
      <option value="expense">기타 지출</option><option value="other">기타 활동</option>
     </select></label>
    </div>
    <div class="two">
     <label>수량 (모르면 비워두기)<input type="number" id="metric" step="0.01" min="0" placeholder="예: 60"></label>
     <label>단위<select id="unit"><option value="">해당 없음</option><option value="분">분</option><option value="회">회</option><option value="자">글자</option><option value="쪽">쪽</option><option value="잔">잔</option></select></label>
    </div>
    <label>지출 금액 (원, 없으면 비워두기)<input type="number" id="amount" step="1" min="0" placeholder="예: 20000"></label>
    <label>메모<textarea id="note" maxlength="2000" placeholder="무엇을 했는지 적어줘"></textarea></label>
    <div class="formactions"><button class="btn" id="submit" type="submit">서버에 기록 저장</button></div>
   </form>
  </section>
 </div>
 <div id="message" aria-live="polite"></div>
</main>
<script src="../config.js"></script>
<script>
(function(){
'use strict';
var conf=window.MYDAY_CONFIG,BASE=conf.supabaseUrl,KEY=conf.supabasePublishableKey,AUTH='haru-auth-v3';
var session=null,user=null,events=[],period='30',busy=false;
var labels={work:'정상 출근',exercise:'운동',reading:'웹소설 읽기',writing:'웹소설 쓰기',no_alcohol:'금주',alcohol:'음주',delivery:'배달',medication:'약 복용',expense:'기타 지출',other:'기타'};
function e(id){return document.getElementById(id)}
function setMessage(t){e('message').textContent=t}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function today(){var p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());var m={};p.forEach(function(x){m[x.type]=x.value});return m.year+'-'+m.month+'-'+m.day}
function plusDays(day,delta){var d=new Date(day+'T12:00:00+09:00');d.setUTCDate(d.getUTCDate()+delta);return d.toISOString().slice(0,10)}
function authHeaders(){return {'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}}
async function refreshAuth(){
 if(!session||!session.refresh_token)throw Error('로그인이 필요해');
 var res=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
 var body=await res.json();if(!res.ok)throw Error('로그인 만료: 하루한칸에서 다시 로그인해 줘');
 session={access_token:body.access_token,refresh_token:body.refresh_token,expires_at:Math.floor(Date.now()/1000)+body.expires_in};
 localStorage.setItem(AUTH,JSON.stringify(session));
}
async function request(path,opts){
 if(session.expires_at < Date.now()/1000+60)await refreshAuth();
 var o=opts||{},send=function(){return fetch(BASE+path,{method:o.method||'GET',headers:Object.assign({},authHeaders(),o.headers||{}),body:o.body?JSON.stringify(o.body):undefined})};
 var r=await send();if(r.status===401){await refreshAuth();r=await send()}
 if(!r.ok){var j=await r.json().catch(function(){return {}});throw Error(j.message||j.error||'저장/조회 실패 ('+r.status+')')}
 if(r.status===204)return null;
 return r.json();
}
async function load(){
 var out=[],offset=0;
 for(var n=0;n<20;n++){
  var rows=await request('/rest/v1/ai_activity_events?select=*&order=happened_on.desc,created_at.desc&limit=1000&offset='+offset);
  out=out.concat(rows);if(rows.length<1000)break;offset+=1000;
 }
 events=out;draw();setMessage('기록 '+events.length+'건을 불러왔어.');
}
function selectedRows(){
 if(period==='all')return events;
 var cutoff=plusDays(today(),1-Number(period));
 return events.filter(function(x){return x.happened_on>=cutoff&&x.happened_on<=today()});
}
function uniqueDays(a){return new Set(a.map(function(x){return x.happened_on})).size}
function stat(label,value,detail){var d=document.createElement('div');d.className='stat';d.innerHTML='<div class="label">'+esc(label)+'</div><strong>'+esc(value)+'</strong><small>'+esc(detail||'')+'</small>';return d}
function draw(){
 var rows=selectedRows(),stats=e('stats');stats.replaceChildren();
 var by=function(k){return rows.filter(function(x){return x.kind===k})};
 var total=function(a,f){return a.reduce(function(s,x){return s+Number(f(x)||0)},0)};
 var exercise=by('exercise').filter(function(x){return x.metric_unit==='분'});
 var writing=by('writing').filter(function(x){return x.metric_unit==='분'});
 [
  ['정상 출근',uniqueDays(by('work'))+'일','입력된 날짜만 집계'],
  ['운동 시간',total(exercise,function(x){return x.metric_value}).toLocaleString()+'분',uniqueDays(by('exercise'))+'일 기록'],
  ['웹소설 읽기',uniqueDays(by('reading'))+'일','독서 활동 기록일'],
  ['웹소설 쓰기',uniqueDays(by('writing'))+'일',total(writing,function(x){return x.metric_value})+'분 기록'],
  ['금주 확인',uniqueDays(by('no_alcohol'))+'일','확인된 날만 집계'],
  ['음주 기록',uniqueDays(by('alcohol'))+'일','입력된 음주일'],
  ['배달 횟수',by('delivery').length+'회',money(total(by('delivery'),function(x){return x.amount_krw}))+' 지출'],
  ['총 기록 지출',money(total(rows,function(x){return x.amount_krw})),'금액이 입력된 기록만 합산'],
  ['약 복용 확인',uniqueDays(by('medication'))+'일','기록된 복용일']
 ].forEach(function(x){stats.appendChild(stat(x[0],x[1],x[2]))});
 var bars=e('bars');bars.replaceChildren();
 var recent=[];for(var i=6;i>=0;i--){var d=plusDays(today(),-i);recent.push({day:d,count:events.filter(function(x){return x.happened_on===d}).length})}
 var max=Math.max(1,...recent.map(function(x){return x.count}));
 recent.forEach(function(x){var row=document.createElement('div');row.className='barwrap';row.innerHTML='<span>'+esc(x.day.slice(5))+'</span><div class="track"><div style="width:'+100*x.count/max+'%"></div></div><span>'+x.count+'건</span>';bars.appendChild(row)});
 var hist=e('history');hist.replaceChildren();
 if(!rows.length){hist.innerHTML='<div class="empty">아직 기록이 없어. 채팅으로 한 가지부터 말해줘.</div>';return}
 rows.slice(0,150).forEach(function(x){
  var node=document.createElement('div');node.className='entry';
  var metric=x.metric_value!=null?(Number(x.metric_value).toLocaleString('ko-KR')+' '+(x.metric_unit||'')):'';
  var spent=x.amount_krw!=null?money(x.amount_krw):'';
  var desc=[metric,spent,x.note].filter(Boolean).join(' · ');
  node.innerHTML='<div><strong>'+esc(labels[x.kind]||x.kind)+' <span class="pill">'+esc(x.source==='chat'?'채팅 기록':'직접 입력')+'</span></strong><div class="meta">'+esc(x.happened_on)+(desc?' · '+esc(desc):'')+'</div></div><button class="btn danger" type="button">삭제</button>';
  node.querySelector('button').addEventListener('click',function(){remove(x.id)});hist.appendChild(node);
 });
}
async function remove(id){
 if(busy||!window.confirm('이 기록을 삭제할까?'))return;
 busy=true;
 try{await request('/rest/v1/ai_activity_events?id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(user.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await load();setMessage('기록을 삭제했어.')}
 catch(err){setMessage('⚠ '+err.message)}finally{busy=false}
}
async function add(ev){
 ev.preventDefault();if(busy)return;busy=true;e('submit').disabled=true;
 try{
  var metric=e('metric').value,amount=e('amount').value;
  var data={user_id:user.id,happened_on:e('day').value,kind:e('kind').value,metric_value:metric===''?null:Number(metric),metric_unit:e('unit').value,amount_krw:amount===''?null:Number(amount),note:e('note').value.trim(),source:'web',source_text:''};
  await request('/rest/v1/ai_activity_events',{method:'POST',headers:{Prefer:'return=representation'},body:data});
  e('metric').value='';e('amount').value='';e('note').value='';await load();setMessage('서버에 저장을 완료했어.');
 }catch(err){setMessage('⚠ 저장 실패: '+err.message)}finally{busy=false;e('submit').disabled=false}
}
async function init(){
 e('day').value=today();
 try{session=JSON.parse(localStorage.getItem(AUTH)||'null')}catch{session=null}
 if(!session){e('login').classList.remove('hidden');setMessage('기존 하루한칸 계정으로 로그인해 줘.');return}
 try{user=await request('/auth/v1/user');if(!user.id)throw Error('사용자 확인 실패');e('screen').classList.remove('hidden');await load()}
 catch(err){e('login').classList.remove('hidden');e('screen').classList.add('hidden');setMessage('⚠ '+err.message)}
}
document.querySelectorAll('[data-period]').forEach(function(b){b.addEventListener('click',function(){period=b.dataset.period;document.querySelectorAll('[data-period]').forEach(function(t){t.classList.toggle('active',t===b)});draw()})});
e('form').addEventListener('submit',add);
e('refresh').addEventListener('click',function(){load().catch(function(err){setMessage('⚠ '+err.message)})});
init();
})();
</script>
</body></html>
