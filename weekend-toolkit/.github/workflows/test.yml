name: Validate tool hub
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build site
        run: python3 build.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: JS syntax checks
        run: |
          find assets apps -name '*.js' -print0 | xargs -0 -n1 node --check
