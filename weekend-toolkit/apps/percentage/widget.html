<section class="widget panel" aria-label="퍼센트 계산기">
  <h2 class="widget-title">전체에서 몇 퍼센트인가요?</h2>
  <div class="fieldrow"><label class="label" for="pct-whole">전체 값</label><input inputmode="decimal" id="pct-whole" type="number" step="any" value="200" /></div>
  <div class="fieldrow"><label class="label" for="pct-part">일부 값</label><input inputmode="decimal" id="pct-part" type="number" step="any" value="40" /></div>
  <p class="result" id="pct-ratio" aria-live="polite">20%</p>
  <p class="formula">일부 값 ÷ 전체 값 × 100</p>
  <div class="rule"></div>
  <h2 class="widget-title">어떤 값의 몇 퍼센트인가요?</h2>
  <div class="fieldrow"><label class="label" for="pct-base">기준 값</label><input inputmode="decimal" id="pct-base" type="number" step="any" value="30000" /></div>
  <div class="fieldrow"><label class="label" for="pct-percent">퍼센트 (%)</label><input inputmode="decimal" id="pct-percent" type="number" step="any" value="15" /></div>
  <p class="result" id="pct-value" aria-live="polite">4,500</p>
  <p class="formula">기준 값 × 퍼센트 ÷ 100</p>
</section>
