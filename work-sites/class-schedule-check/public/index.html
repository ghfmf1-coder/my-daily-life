<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="학원 수업시간표 충돌 검사기 - 브라우저 안에서 처리되는 무료 작은 도구함 검사기"><title>학원 수업시간표 충돌 검사기 | 작은 도구함</title><style>body{margin:0;background:#f3f6fb;color:#172b47;font:16px system-ui,sans-serif}header{background:#132945;color:white;padding:22px 6%}main{max-width:1000px;margin:auto;padding:40px 22px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em}.card{background:white;border:1px solid #dce5f1;padding:24px;border-radius:16px;margin:22px 0}label{display:block;font-weight:bold;margin:18px 0}input{display:block;margin-top:8px;padding:10px;max-width:100%}button{background:#225bcc;color:white;border:0;border-radius:9px;padding:13px 20px;font:inherit;cursor:pointer;margin:3px}button:disabled{opacity:.4}p{line-height:1.8;color:#54677f}table{width:100%;border-collapse:collapse;font-size:13px}td{border-bottom:1px solid #ddd;padding:10px;overflow-wrap:anywhere}#out{overflow:auto}.cert{border:8px double #314b77;text-align:center;padding:34px;page-break-after:always;margin:20px 0}.cert h2{font-size:35px}@media print{header,form,#out,.guide,h1{display:none}.cert{display:block}}</style><link rel="canonical" href="https://tb-class-schedule-check.pages.dev/"><meta name="google-site-verification" content="DlmGUQloOH4hbNQzj-j9Y8GXGp8FVgLhFPqd12qe1DY">
</head><body><header><a href="https://abreda.com/" style="color:white;text-decoration:none">작은 도구함 / Small Toolbox</a></header><main><h1>학원 수업시간표 충돌 검사기</h1><p>파일을 선택하면 별도 가입 없이 브라우저 안에서 분석합니다. 파일은 서버에 저장되지 않습니다. 이 버전은 초기 기능 테스트용입니다.</p><section class="card"><form id="form"><label>수업 시간표 CSV<input id="file0" type="file" accept=".csv,.tsv,.txt"  required></label><button type="submit">검사 / 제작 실행</button><button id="save" type="button" disabled>결과 CSV 다운로드</button></form></section><section id="out" class="card">검사 결과가 이곳에 표시됩니다.</section><section class="card guide"><strong>이용 안내</strong><p>CSV는 UTF-8, 첫 행은 열 제목이어야 합니다. 결과는 참고 정보이며 중요한 결정 전 반드시 원자료를 확인하세요. 검사 대상 밖의 오류는 탐지하지 못할 수 있습니다. 법적으로 배제할 수 없는 운영자 책임까지 면책하지 않습니다.</p></section></main><script>const pick=(r,n)=>{for(const k of n)if(Object.hasOwn(r,k))return String(r[k]??'').trim();return ''};const num=v=>Number(String(v).replace(/[,원₩ ]/g,''));const finding=(type,key,detail)=>({type,key:String(key),detail:String(detail)});
function csv(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if((c===','||c==='\t')&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(Boolean))rows.push(row);if(quoted||rows.length<2||rows.length>50001)throw Error('CSV 제목/자료 형식을 확인하세요 (최대 50,000행).');const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]||''])))}async function read(f){return csv(await f.text())}
function exportCSV(items){const q=x=>'"'+String(x).replace(/^[=+@-]/,s=>"'"+s).replace(/"/g,'""')+'"';return'\uFEFF'+[['종류','항목','설명'],...items.map(x=>[x.type,x.key,x.detail])].map(r=>r.map(q).join(',')).join('\r\n')}
async function analyze(files){const data=await read(files[0]),rows=[],slots=[];const min=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s);return m?+m[1]*60+ +m[2]:NaN};for(const r of data){const day=pick(r,['요일','날짜','day','date']),start=pick(r,['시작','시작시간','start']),end=pick(r,['종료','종료시간','end']),a=min(start),b=min(end);if(!day||!Number.isFinite(a)||!Number.isFinite(b)||a>=b){rows.push(finding('수업시간 오류',day||'—',start+'~'+end));continue}slots.push({day,a,b,teacher:pick(r,['강사','teacher']),room:pick(r,['강의실','room']),student:pick(r,['학생','student'])})}for(let i=0;i<slots.length;i++)for(let j=i+1;j<slots.length;j++){const a=slots[i],b=slots[j];if(a.day!==b.day||a.a>=b.b||b.a>=a.b)continue;for(const[k,label]of [['teacher','강사'],['room','강의실'],['student','학생']])if(a[k]&&a[k]===b[k])rows.push(finding(label+' 중복 배정',a[k],a.day+' / '+a.a+'~'+a.b+'분과 '+b.a+'~'+b.b+'분 충돌'))}return rows;}
const form=document.getElementById('form'),out=document.getElementById('out'),save=document.getElementById('save');let findings=[];form.addEventListener('submit',async e=>{e.preventDefault();try{out.textContent='검사하는 중...';const files=[document.getElementById('file0').files[0]];if(!files.length||files.some(f=>!f))throw Error('파일이 필요합니다.');if(files.some(f=>f.size>16*1024*1024))throw Error('파일당 최대 16MB');findings=await analyze(files);out.replaceChildren();const p=document.createElement('h2');p.textContent='결과: '+findings.length+'건';out.append(p);const table=document.createElement('table');for(const x of findings.slice(0,2000)){const tr=document.createElement('tr');for(const val of [x.type,x.key,x.detail]){const td=document.createElement('td');td.textContent=val;tr.append(td)}table.append(tr)}out.append(table);save.disabled=!findings.length}catch(err){out.textContent='검사 오류: '+err.message;save.disabled=true}});save.addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([exportCSV(findings)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='tool-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
