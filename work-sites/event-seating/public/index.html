<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="행사 좌석 자동 배치기 - 브라우저에서 개인정보를 업로드하지 않고 파일을 분석하는 작은 도구함 도구"><title>행사 좌석 자동 배치기 | 작은 도구함</title><style>body{margin:0;background:#f3f6fc;color:#182f4d;font:16px system-ui,sans-serif}header{background:#152a49;color:white;padding:21px 7%}a{color:inherit}main{max-width:1000px;margin:auto;padding:35px 24px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.05em}.panel{background:white;border:1px solid #d8e4f3;border-radius:16px;padding:23px;margin:22px 0;overflow:auto}label{display:block;font-weight:700;margin:16px 0}input{display:block;padding:12px;max-width:100%}button{border:0;border-radius:10px;background:#235dca;color:white;padding:13px 20px;margin:4px;font:inherit;cursor:pointer}button:disabled{opacity:.4}p{line-height:1.8;color:#5b718b}td{padding:11px;border-bottom:1px solid #dbe4ef;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:13px}figure{display:inline-block}#preview img{max-width:200px}#preview .print{border:4px double #7290b6;padding:30px;page-break-after:always}@media print{header,h1,form,#out,.note{display:none}}</style><link rel="canonical" href="https://tb-event-seating.pages.dev/"></head><body><header><a href="https://abreda.com/">작은 도구함 · Small Toolbox</a></header><main><h1>행사 좌석 자동 배치기</h1><p>브라우저 내부에서만 작동하는 초기 기능 검증판입니다. 원본 파일은 서버로 보내지 않습니다.</p><section class="panel"><form id="form"><label>검사할 파일<input id="file0" type="file" accept=".csv,.tsv"  required></label><label>정원 또는 조 개수 <input id="number" type="number" value="4" min="1" max="30"></label><button type="submit">검사·제작 실행</button><button id="save" type="button" disabled>CSV 결과 저장</button></form></section><div id="out" class="panel">검사 전</div><div id="preview"></div><section class="panel note"><h2>검사 한계</h2><p>지원하는 일부 구조와 항목만 검사하며 법적 권리·안전·인쇄/제조 적합성을 보증하지 않습니다. 결과는 참고용이고 원본과 전문 자료를 직접 확인해야 합니다. 관련 법령상 운영자의 면책 불가능한 책임까지 부인하지 않습니다.</p></section></main><script>function csv(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if((c===','||c==='\t')&&!q){r.push(v.trim());v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v.trim());if(r.some(Boolean))a.push(r);r=[];v=''}else v+=c}r.push(v.trim());if(r.some(Boolean))a.push(r);if(q||a.length<2||a.length>50001)throw Error('CSV 형식 오류 또는 5만 행 초과');const h=a.shift();return a.map(x=>Object.fromEntries(h.map((v,i)=>[v,x[i]||''])))}const get=(x,ks)=>{for(const k of ks)if(Object.hasOwn(x,k))return String(x[k]||'').trim();return''};const item=(a,b,c)=>({a:String(a),b:String(b),c:String(c)});async function analyze(f){const rows=csv(await f[0].text()),cap=Math.max(1,Math.min(30,Number(document.querySelector('#number').value)||8)),tables=[],r=[];for(const x of rows){const name=get(x,['이름','name']),group=get(x,['그룹','group']);if(!name)continue;let t=tables.find(t=>t.group===group&&t.people.length<cap);if(!t){t={group,people:[]};tables.push(t)}t.people.push(name)}return tables.map((t,i)=>item('테이블 '+(i+1),t.group||'그룹 미지정',t.people.join(', ')));}const form=document.querySelector('#form'),out=document.querySelector('#out'),save=document.querySelector('#save');let rows=[];form.addEventListener('submit',async e=>{e.preventDefault();try{const f=[document.getElementById('file0').files[0]];if(!f.length||f.some(x=>!x))throw Error('파일을 선택하세요');if(f.some(x=>x.size>20e6))throw Error('20MB 이하 파일 필요');document.querySelector('#preview').replaceChildren();rows=await analyze(f);if(!rows.length)rows=[item('기본 검사 완료','탐지 항목 0개','별도의 상세 검증이 필요할 수 있습니다.')];out.replaceChildren();const h=document.createElement('h2');h.textContent='검사 결과 '+rows.length+'건';out.append(h);const table=document.createElement('table');for(const x of rows.slice(0,2000)){const tr=document.createElement('tr');for(const text of [x.a,x.b,x.c]){const td=document.createElement('td');td.textContent=text;tr.append(td)}table.append(tr)}out.append(table);save.disabled=false}catch(err){out.textContent='처리 실패: '+err.message;save.disabled=true}});save.addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([exportCSV(rows)],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});</script></body></html>
