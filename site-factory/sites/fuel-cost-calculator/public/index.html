<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자동차 주유비·연비 계산기 | ABREDA</title><meta name="description" content="이동거리와 실제 연비, 연료 단가를 입력해 예상 사용량 및 거리 기준 주유비를 계산합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>자동차 주유비·연비 계산기</h1><p>이동거리와 실제 연비, 연료 단가를 입력해 예상 사용량 및 거리 기준 주유비를 계산합니다.</p><form id="toolForm"><label for="distance">이동거리 (km 또는 mile)<input name="distance" id="distance" type="number" min="0" step="any" inputmode="decimal" required></label><label for="economy">연비 (km/L 또는 mpg)<input name="economy" id="economy" type="number" min="0" step="any" inputmode="decimal" required></label><label for="price">연료 단가 (L당 또는 US gal당)<input name="price" id="price" type="number" min="0" step="any" inputmode="decimal" required></label><label for="mode">단위 체계<select id="mode" name="mode"><option value="metric">km / L</option><option value="us">mile / US gallon</option></select></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>왕복이라면 왕복 전체 거리를 입력하세요. km와 km/L, L당 가격을 함께 쓰거나 mile과 mpg, 미국 갤런당 가격을 함께 사용합니다. 실제 주행 연비는 정체, 공회전, 날씨 등에 따라 달라지며 통행료와 주차비는 별도입니다.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
