<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="작은도구함 신규 사이트 자동 배포를 기술적으로 확인하는 임시 테스트 화면입니다.">
<title>배포 연결 확인 | 작은도구함</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="card">
  <p class="kicker">SMALL TOOLBOX · DEPLOYMENT CHECK</p>
  <h1>새 사이트 자동 배포 테스트</h1>
  <p class="intro">이 페이지는 작은도구함의 GitHub → Cloudflare Pages 배포 연결을 검증하기 위한 비색인 기술 테스트입니다. 공개 서비스가 아닙니다.</p>
  <div class="status" role="status"><span class="dot"></span><strong>페이지 파일 로드 완료</strong></div>
  <label for="input">입력 문장을 작성해 보세요</label>
  <textarea id="input" rows="5" placeholder="문장을 여러 줄 입력하세요">첫 줄\n\n첫 줄\n둘째 줄</textarea>
  <div class="buttons"><button id="run" type="button">빈 줄·중복 줄 제거</button><button id="reset" type="button" class="secondary">초기화</button></div>
  <label for="output">변환 결과</label>
  <pre id="output" aria-live="polite">버튼을 눌러 JavaScript 작동을 확인하세요.</pre>
  <p class="fine">데이터는 브라우저 내부에서만 처리합니다. 이 페이지는 검색엔진에 색인을 요청하지 않습니다.</p>
</main>
<script src="./app.js" defer></script>
</body>
</html>
