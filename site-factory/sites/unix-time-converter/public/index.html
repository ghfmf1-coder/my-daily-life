<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유닉스 시간 변환기 | ABREDA</title><meta name="description" content="초·밀리초 유닉스 타임스탬프와 UTC·현지 시간을 상호 변환합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>유닉스 시간 변환기</h1><p>서버 로그와 API 응답에 표시되는 유닉스 시간은 사람이 읽는 날짜와 다릅니다. 입력한 숫자가 초인지 밀리초인지 먼저 확인한 뒤 UTC와 기기 현지 시간을 비교해야 시간대 오류를 피할 수 있습니다.</p><label><span data-ko="타임스탬프" data-en="Timestamp">타임스탬프</span><input id="stamp" inputmode="numeric" value="0"></label><label><span data-ko="단위" data-en="Unit">단위</span><select id="unit"><option value="s" data-ko="초" data-en="Seconds">초</option><option value="ms" data-ko="밀리초" data-en="Milliseconds">밀리초</option></select></label><button id="convert" data-ko="변환" data-en="Convert">변환</button><button id="now" data-ko="현재 시각" data-en="Current time">현재 시각</button><textarea id="out" rows="3" readonly></textarea><p id="status" role="status"></p><p>브라우저 안에서 처리합니다. 중요한 결과는 원본과 대조하세요.</p></main></div><script>window.ABREDA_LANG="ko";</script><script src="app.js" defer></script></body></html>
