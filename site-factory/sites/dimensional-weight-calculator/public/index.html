<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>택배 부피무게 계산기 | ABREDA</title><meta name="description" content="상자 가로·세로·높이와 실측 무게, 운송사 부피무게 환산계수를 입력해 과금 기준 무게를 비교합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>택배 부피무게 계산기</h1><p>상자 가로·세로·높이와 실측 무게, 운송사 부피무게 환산계수를 입력해 과금 기준 무게를 비교합니다.</p><form id="toolForm"><label for="l">가로 (cm)<input name="l" id="l" type="number" min="0" step="any" inputmode="decimal" required></label><label for="w">세로 (cm)<input name="w" id="w" type="number" min="0" step="any" inputmode="decimal" required></label><label for="h">높이 (cm)<input name="h" id="h" type="number" min="0" step="any" inputmode="decimal" required></label><label for="kg">실제 무게 (kg)<input name="kg" id="kg" type="number" min="0" step="any" inputmode="decimal" required></label><label for="divisor">운송사 환산계수 (cm³/kg)<input name="divisor" id="divisor" type="number" min="0" step="any" inputmode="decimal" required></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>완전히 포장한 상자의 가장 긴 바깥쪽 치수를 측정하세요. 운송사와 배송 서비스별 환산계수를 직접 확인해 입력합니다. 과금 기준은 실측 무게와 부피무게 중 큰 값으로 표시하지만 운송사의 올림 규칙, 최대 규격, 추가 요금은 별도입니다.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
