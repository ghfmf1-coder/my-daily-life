<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가전제품 전력사용량 계산기 | ABREDA</title><meta name="description" content="전기장판·히터·가전제품의 소비전력과 사용시간으로 kWh 및 직접 입력한 단가 기준 전력비를 계산합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>가전제품 전력사용량 계산기</h1><p>전기장판·히터·가전제품의 소비전력과 사용시간으로 kWh 및 직접 입력한 단가 기준 전력비를 계산합니다.</p><form id="toolForm"><label for="watts">소비전력 (W)<input name="watts" id="watts" type="number" min="0" step="any" inputmode="decimal" required></label><label for="hours">하루 사용시간<input name="hours" id="hours" type="number" min="0" step="any" inputmode="decimal" required></label><label for="days">사용 일수<input name="days" id="days" type="number" min="0" step="any" inputmode="decimal" required></label><label for="rate">kWh당 단가<input name="rate" id="rate" type="number" min="0" step="any" inputmode="decimal" required></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>기기의 정격 소비전력과 실제 켜져 있는 시간을 입력하세요. 자동 온도 조절 기기는 정격전력으로 계속 작동하지 않을 수 있으므로 소비전력 측정기의 실제 kWh를 우선하세요. 요금은 입력 단가를 곱한 금액으로 누진제, 기본요금, 세금, 기타 청구액은 포함하지 않습니다.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
