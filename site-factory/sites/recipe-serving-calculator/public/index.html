<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요리 레시피 인분 변환기 | ABREDA</title><meta name="description" content="원래 인분과 원하는 인분을 입력하고 여러 재료의 수량을 같은 비율로 변환합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>요리 레시피 인분 변환기</h1><p>원래 인분과 원하는 인분을 입력하고 여러 재료의 수량을 같은 비율로 변환합니다.</p><form id="toolForm"><label for="from">원래 인분<input name="from" id="from" type="number" min="0" step="any" inputmode="decimal" required></label><label for="to">변경 인분<input name="to" id="to" type="number" min="0" step="any" inputmode="decimal" required></label><label for="items">재료 (이름,수량,단위 / 줄마다 하나)<textarea name="items" id="items" rows="5"></textarea></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>재료는 '밀가루,200,g'처럼 이름과 숫자, 단위를 쉼표로 구분합니다. 원래 인분과 변경 인분은 양수로 입력하세요. 달걀처럼 정수 단위가 필요한 재료는 결과를 보고 조정합니다. 소금·향신료·조리시간은 배율대로 늘리면 맛이나 익힘 정도가 달라질 수 있습니다.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
