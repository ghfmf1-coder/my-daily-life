<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안전한 비밀번호 생성기 | ABREDA</title><meta name="description" content="브라우저의 암호학적 난수로 비밀번호를 생성하고 복사합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>안전한 비밀번호 생성기</h1><p>비밀번호를 직접 조합하면 익숙한 단어와 숫자 패턴을 반복하기 쉽습니다. 생성기는 브라우저의 암호학적 난수를 사용하여 사용자가 선택한 길이와 문자 종류에 맞는 문자열을 만듭니다.</p><label><span data-ko="길이 (8~128)" data-en="Length (8–128)">길이 (8~128)</span> <input id="len" type="number" min="8" max="128" value="20"></label><fieldset><legend data-ko="포함할 문자" data-en="Character groups">포함할 문자</legend><label><input id="upper" type="checkbox" checked> A–Z</label><label><input id="lower" type="checkbox" checked> a–z</label><label><input id="digits" type="checkbox" checked> 0–9</label><label><input id="symbols" type="checkbox" checked> !@#$</label></fieldset><button id="generate" data-ko="생성" data-en="Generate">생성</button><label><span data-ko="생성 결과" data-en="Generated password">생성 결과</span><input id="out" readonly autocomplete="off" spellcheck="false"></label><button id="copy" data-ko="복사" data-en="Copy">복사</button><p id="status" role="status"></p><p>브라우저 안에서 처리합니다. 중요한 결과는 원본과 대조하세요.</p></main></div><script>window.ABREDA_LANG="ko";</script><script src="app.js" defer></script></body></html>
