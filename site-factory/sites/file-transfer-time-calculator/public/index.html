<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파일 전송시간 계산기 | ABREDA</title><meta name="description" content="파일 용량(MB·GB·MiB·GiB)과 실제 전송속도(Mbps)를 입력해 이론적인 전송시간을 계산합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>파일 전송시간 계산기</h1><p>파일 용량(MB·GB·MiB·GiB)과 실제 전송속도(Mbps)를 입력해 이론적인 전송시간을 계산합니다.</p><form id="toolForm"><label for="size">파일 용량<input name="size" id="size" type="number" min="0" step="any" inputmode="decimal" required></label><label for="unit">용량 단위<select id="unit" name="unit"><option value="MB">MB</option><option value="GB">GB</option><option value="MiB">MiB</option><option value="GiB">GiB</option></select></label><label for="speed">실제 전송속도 (Mbps)<input name="speed" id="speed" type="number" min="0" step="any" inputmode="decimal" required></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>업로드는 실제 업로드 속도, 다운로드는 실제 다운로드 속도를 입력하세요. Mbps는 초당 메가비트이며 MB/s와 다릅니다. 8비트가 1바이트입니다. 네트워크 혼잡, 암호화, 프로토콜 오버헤드, 서버 제한 및 중단은 계산에 포함되지 않습니다.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
