<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Send feedback, report bugs or suggest a new free tool to Small Toolbox."><link rel="canonical" href="https://abreda.com/en/contact"><title>Contact and feedback | Small Toolbox</title><style>body{margin:0;background:#f4f7fb;color:#17243b;font:16px/1.65 system-ui,sans-serif}main{max-width:700px;margin:0 auto;padding:28px 18px 70px}nav{display:flex;justify-content:space-between;gap:20px;margin-bottom:35px}a{color:#2458b8}h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.04em}.muted{color:#65758b}.panel{background:white;padding:clamp(22px,4vw,38px);border:1px solid #e1e8f2;border-radius:18px;box-shadow:0 8px 28px #20335a09}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc9dc;border-radius:10px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}button{margin-top:22px;background:#2563eb;color:white;border:0;border-radius:11px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}footer{margin-top:24px;color:#65758b;font-size:13px}</style></head><body><main><nav><a href="/">← Small Toolbox</a><a href="/contact">한국어</a></nav><h1>Contact & feedback</h1><p class="muted">Tell us what isn't working or what tool you'd like to see.</p><section class="panel"><form id="contact"><label for="kind">Topic</label><select id="kind" name="kind" required><option value="bug">Bug report</option><option value="feature">Tool or feature idea</option><option value="general">General inquiry</option></select><label for="email">Reply email (optional)</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com"><label for="message">Message</label><textarea id="message" name="message" maxlength="4000" minlength="10" required placeholder="What happened or what would you like us to build?"></textarea><div style="display:none" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="muted" style="font-size:13px">Your message and optional reply email are used to handle your request. Do not send passwords or sensitive information. <a href="/en/privacy">Privacy policy</a></p><button id="submit" type="submit">Send feedback</button><p id="status" role="status" aria-live="polite"></p></form></section><footer>Small Toolbox · <a href="/">All tools</a></footer></main><script>document.getElementById('contact').addEventListener('submit',async function(e){e.preventDefault();const b=document.getElementById('submit'),s=document.getElementById('status');b.disabled=true;s.textContent='Sending...';try{let data=Object.fromEntries(new FormData(this));let r=await fetch('/api/contact',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('not-ready');s.textContent='Your message was received. Thank you.';this.reset()}catch(e){s.textContent='The contact service is not available yet. Please try again later.'}finally{b.disabled=false}})</script></body></html>
