<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="작은도구함에 오류를 제보하거나 새 도구를 제안해 주세요."><link rel="canonical" href="https://abreda.com/contact"><title>문의·오류 제보·도구 제안 | Small Toolbox</title><style>body{margin:0;background:#f4f7fb;color:#17243b;font:16px/1.65 system-ui,sans-serif}main{max-width:700px;margin:0 auto;padding:28px 18px 70px}nav{display:flex;justify-content:space-between;gap:20px;margin-bottom:35px}a{color:#2458b8}h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.04em}.muted{color:#65758b}.panel{background:white;padding:clamp(22px,4vw,38px);border:1px solid #e1e8f2;border-radius:18px;box-shadow:0 8px 28px #20335a09}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc9dc;border-radius:10px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}button{margin-top:22px;background:#2563eb;color:white;border:0;border-radius:11px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}footer{margin-top:24px;color:#65758b;font-size:13px}</style></head><body><main><nav><a href="/">← 작은도구함</a><a href="/en/contact">English</a></nav><h1>문의·의견 보내기</h1><p class="muted">불편했던 점이나 필요한 도구를 알려주세요.</p><section class="panel"><form id="contact"><label for="kind">문의 유형</label><select id="kind" name="kind" required><option value="bug">오류 제보</option><option value="feature">새 도구·기능 제안</option><option value="general">일반 문의</option></select><label for="email">답변받을 이메일 (선택)</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com"><label for="message">문의 내용</label><textarea id="message" name="message" maxlength="4000" minlength="10" required placeholder="어떤 상황에서 무엇이 불편했나요?"></textarea><div style="display:none" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="muted" style="font-size:13px">문의 내용과 선택적으로 입력한 이메일은 답변·오류 처리에 사용됩니다. 비밀번호나 민감한 개인정보는 입력하지 마세요. <a href="/privacy">개인정보처리방침</a></p><button id="submit" type="submit">문의 보내기</button><p id="status" role="status" aria-live="polite"></p></form></section><footer>Small Toolbox · <a href="/">도구 목록</a></footer></main><script>document.getElementById('contact').addEventListener('submit',async function(e){e.preventDefault();const b=document.getElementById('submit'),s=document.getElementById('status');b.disabled=true;s.textContent='전송 중...';try{let data=Object.fromEntries(new FormData(this));let r=await fetch('/api/contact',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('not-ready');s.textContent='접수되었습니다. 감사합니다.';this.reset()}catch(e){s.textContent='현재 접수 서버 연결을 확인할 수 없습니다. 잠시 후 다시 시도해 주세요.'}finally{b.disabled=false}})</script></body></html>
