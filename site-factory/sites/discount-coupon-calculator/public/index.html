<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할인쿠폰 실결제 비교기 | ABREDA</title><meta name="description" content="정가·정률 할인·정액 쿠폰·배송비를 반영한 실제 결제 금액을 두 상품 간 비교합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>할인쿠폰 실결제 비교기</h1><p>정가·정률 할인·정액 쿠폰·배송비를 반영한 실제 결제 금액을 두 상품 간 비교합니다.</p><form id="toolForm"><label for="a">A 정가<input name="a" id="a" type="number" min="0" step="any" inputmode="decimal" required></label><label for="ar">A 할인율 (%)<input name="ar" id="ar" type="number" min="0" step="any" inputmode="decimal" required></label><label for="ac">A 정액 쿠폰<input name="ac" id="ac" type="number" min="0" step="any" inputmode="decimal" required></label><label for="as">A 배송비·추가비<input name="as" id="as" type="number" min="0" step="any" inputmode="decimal" required></label><label for="b">B 정가<input name="b" id="b" type="number" min="0" step="any" inputmode="decimal" required></label><label for="br">B 할인율 (%)<input name="br" id="br" type="number" min="0" step="any" inputmode="decimal" required></label><label for="bc">B 정액 쿠폰<input name="bc" id="bc" type="number" min="0" step="any" inputmode="decimal" required></label><label for="bs">B 배송비·추가비<input name="bs" id="bs" type="number" min="0" step="any" inputmode="decimal" required></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>정률 할인을 먼저 적용하고 정액 쿠폰을 차감한 뒤 배송비와 추가비를 더하는 계산입니다. 쿠폰 최대 할인액이나 최소 주문금액은 쇼핑몰 안내에 따라 직접 반영해야 합니다. 결제 통화는 두 상품이 같아야 하고 실제 결제 화면을 확인하세요.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
