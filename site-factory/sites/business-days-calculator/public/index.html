<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영업일·근무일 계산기 | ABREDA</title><meta name="description" content="시작일과 종료일 사이의 평일을 계산하고 직접 입력한 공휴일 및 휴무일을 제외합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>영업일·근무일 계산기</h1><p>시작일과 종료일 사이의 평일을 계산하고 직접 입력한 공휴일 및 휴무일을 제외합니다.</p><form id="toolForm"><label for="start">시작일<input name="start" id="start" type="date"  required></label><label for="end">종료일<input name="end" id="end" type="date"  required></label><label for="include">시작일 포함<select id="include" name="include"><option value="yes">포함</option><option value="no">제외</option></select></label><label for="holidays">휴무일 (YYYY-MM-DD, 줄마다 하나)<textarea name="holidays" id="holidays" rows="5"></textarea></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>종료일을 포함하고 토요일과 일요일은 제외합니다. 공휴일은 자동 조회하지 않으므로 국가·회사별 실제 휴무일을 줄마다 입력하세요. 같은 날짜는 한 번만 제외되며 주말 공휴일은 중복 차감하지 않습니다. 법정 기한의 계산 규칙은 해당 기관에 확인하세요.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
