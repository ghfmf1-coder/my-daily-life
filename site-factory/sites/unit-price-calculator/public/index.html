<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단위가격 비교 계산기 | ABREDA</title><meta name="description" content="상품의 총가격과 내용량을 입력해 100g·100ml·개당 가격을 비교하세요. 묶음상품은 전체 내용량을 입력합니다."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav><a href="https://abreda.com/">ABREDA</a><a href="en/">English</a></nav><main><h1>단위가격 비교 계산기</h1><p>상품의 총가격과 내용량을 입력해 100g·100ml·개당 가격을 비교하세요. 묶음상품은 전체 내용량을 입력합니다.</p><form id="toolForm"><label for="a">상품 A 총가격<input name="a" id="a" type="number" min="0" step="any" inputmode="decimal" required></label><label for="aq">상품 A 전체 내용량<input name="aq" id="aq" type="number" min="0" step="any" inputmode="decimal" required></label><label for="b">상품 B 총가격<input name="b" id="b" type="number" min="0" step="any" inputmode="decimal" required></label><label for="bq">상품 B 전체 내용량<input name="bq" id="bq" type="number" min="0" step="any" inputmode="decimal" required></label><label for="unit">비교 단위<select id="unit" name="unit"><option value="100">100g / 100ml</option><option value="1">1개 / 1oz</option></select></label><button type="submit">계산 / 변환</button><button type="reset">초기화</button></form><output id="out" aria-live="polite"></output><button id="copy" type="button">결과 복사</button><p id="status" role="status"></p><section><h2>정확하게 사용하는 방법</h2><p>두 상품의 통화와 내용량 단위를 먼저 통일하세요. 예를 들어 500g 포장 두 개라면 전체 내용량을 1000g으로 입력합니다. 100g과 100ml는 서로 직접 비교할 수 없습니다. 할인 후 실제 결제액을 사용하고, 보관 중 버리는 양도 고려하세요.</p><p>입력 자료는 브라우저에서 처리합니다.</p></section></main></div><script src="app.js" defer></script></body></html>
