name: Ten deployed tools real-browser functionality smoke
on:
  push:
    branches: [main]
    paths:
      - 'site-factory/tests/toolbox-ten-live-smoke.mjs'
      - '.github/workflows/toolbox-live-smoke.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Focused suite
        type: choice
        options: [first-ten, work-tools]
        default: first-ten
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate 10 live tools without contaminating analytics
        run: |
          if [ '${{ inputs.suite }}' = 'work-tools' ]; then
            node site-factory/tests/work-tools-browser.mjs
          else
            node site-factory/tests/toolbox-ten-live-smoke.mjs
          fi
