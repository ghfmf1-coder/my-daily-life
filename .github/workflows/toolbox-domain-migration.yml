name: Toolbox staged abreda.com domain migration
on:
  push:
    branches: [main]
    paths:
      - 'site-factory/ops/migrate-domains.mjs'
      - '.github/workflows/toolbox-domain-migration.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'attach: associate, status: read, dns: add CNAMEs, retry: revalidate deactivated domains'
        required: true
        type: choice
        options: [attach, status, dns, plan, retry]
        default: status
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate migration mapping and syntax
        run: |
          node --check site-factory/ops/migrate-domains.mjs
          node site-factory/ops/migrate-domains.mjs self-test
      - name: Stage/verify existing Pages custom domains
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'status' }}
        run: node site-factory/ops/migrate-domains.mjs "$MODE"
