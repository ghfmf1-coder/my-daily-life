name: Work shipping audit - tests and independent Pages deployment
on:
  push:
    branches: [main]
    paths:
      - 'work-sites/shipping-audit/**'
      - '.github/workflows/shipping-audit-work.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: work-shipping-audit
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression and syntax checks
        run: |
          node --test work-sites/shipping-audit/tests.mjs
          node --check work-sites/shipping-audit/public/core.mjs
          node --check work-sites/shipping-audit/public/xlsx.mjs
          node --check work-sites/shipping-audit/public/app.mjs
      - name: Confirm Cloudflare Pages credentials exist
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN repository secrets."
            exit 1
          fi
      - name: Create isolated Pages project if absent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          CODE=$(curl -sS -o /tmp/shipping-pages.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/tb-shipping-audit")
          if [ "$CODE" = "404" ]; then
            curl -fsS --retry 3 -X POST "$BASE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"tb-shipping-audit","production_branch":"main"}' > /tmp/shipping-created.json
            python3 -c 'import json; assert json.load(open("/tmp/shipping-created.json"))["success"]'
          elif [ "$CODE" = "200" ]; then
            python3 -c 'import json; r=json.load(open("/tmp/shipping-pages.json")); assert r["success"] and r["result"]["name"]=="tb-shipping-audit"; assert (r["result"].get("source") or {}).get("type") != "github", "Refusing to overwrite Git-integrated Pages project"'
          else
            echo "Cloudflare Pages project query failed: HTTP $CODE"
            exit 1
          fi
      - name: Deploy only Work shipping-audit to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy work-sites/shipping-audit/public --project-name tb-shipping-audit --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify deployed HTML and JS assets
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --max-time 15 -fsSL https://tb-shipping-audit.pages.dev/ -o /tmp/work-app.html &&
              grep -q 'toolbox-real-guide' /tmp/work-app.html &&
              curl --max-time 15 -fsSL https://tb-shipping-audit.pages.dev/core.mjs -o /tmp/work-core.mjs &&
              grep -q 'export function compare' /tmp/work-core.mjs; then
                echo 'TEST_DEPLOYMENT_LIVE_VERIFIED'
                exit 0
            fi
            sleep 10
          done
          echo 'Deployment HTTP smoke test failed'
          exit 1
      - name: Explain Work registry auto-registration
        run: |
          echo 'Work admin Worker scans successful Cloudflare Pages production deployments via its configured Pages read token.'
          echo 'After next minute sync confirm adminivo.com/next/ -> Services.'
          echo 'This workflow deliberately does not touch legacy tb-toolbox-admin or add any manual D1 registry row.'
