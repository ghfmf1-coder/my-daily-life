name: Priority publish second ten tools on existing abreda.com and admin
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolbox-second-ten-priority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [toolbox-hub, toolbox-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full factory regression tests
        run: python3 -m unittest discover -s site-factory/tests -v
      - name: Install Cloudflare deploy client
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Publish existing Pages project without DNS changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE: ${{ matrix.site }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          python3 site-factory/scripts/deploy_site.py --site "$SITE"
