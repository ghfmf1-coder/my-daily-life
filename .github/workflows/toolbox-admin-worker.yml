name: Verify and deploy existing toolbox admin Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site-factory/admin-worker/**', '.github/workflows/toolbox-admin-worker.yml']
permissions:
  contents: read
concurrency:
  group: existing-toolbox-admin-worker
  cancel-in-progress: false
jobs:
  verify-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reporting and authentication
        run: |
          node --check site-factory/admin-worker/worker.mjs
          node site-factory/admin-worker/test.mjs
          node site-factory/admin-worker/test-performance.mjs
          node site-factory/admin-worker/test-reporting.cjs
          node site-factory/admin-worker/test-google-worker.cjs
          node site-factory/admin-worker/google-oauth-edge/test-github-oidc.mjs
      - name: Deploy existing Worker preserving bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
        run: node site-factory/admin-worker/deploy-existing-worker.mjs
