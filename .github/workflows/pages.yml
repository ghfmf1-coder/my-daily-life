name: Publish to GitHub Pages
on:
  # Retired Haruhankan only: no automatic deployment on ABREDA changes.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check JavaScript syntax before deployment
        run: |
          node --check app.js
          node --check config.js
          node --check en/app/translate.js
      - name: Generate SEO URLs for GitHub Pages
        run: |
          echo "Retired app: preserve noindex pages and empty sitemap"
      - name: Assemble public static site
        run: |
          mkdir -p dist/app dist/en/app dist/quest
          cp toolbox-traffic.js index.html landing.css styles.css app.js config.js icon.svg favicon.ico manifest.webmanifest privacy.html terms.html sitemap.xml robots.txt dist/
          cp app/index.html app/ai-log.html dist/app/
          cp quest/* dist/quest/
          cp en/index.html dist/en/index.html
          cp en/app/index.html en/app/translate.js dist/en/app/
          cp 009bd80b09e04b4e82564b5ae044a4e7.txt dist/009bd80b09e04b4e82564b5ae044a4e7.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
