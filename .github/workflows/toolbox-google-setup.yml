name: 작은도구함 구글 등록·사이트맵 자동화
run-name: '작은도구함 구글 등록·사이트맵 자동화 · ${{ github.run_number }}차'
on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  workflow_run:
    workflows: ['작은도구함 승인 사이트 자동 배포', '작은도구함 독립 도구 20개 검사·배포', '작은도구함 전문 도구 9개 검사·배포', '작은도구함 배송 도구 검사·배포']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolbox-google-setup.yml'
      - 'site-factory/ops/google_search_setup.py'
      - 'site-factory/ops/search-setup-request.json'
permissions:
  contents: write
  id-token: write
concurrency:
  group: toolbox-google-search-setup
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 기존 배포 도구 준비
        run: npm install --no-save --no-package-lock wrangler@4
      - name: 구글 소유확인 및 사이트맵 제출
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_PAGES_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 site-factory/ops/google_search_setup.py
      - name: 공개 검증 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-google-search-setup-result
          path: /tmp/toolbox-google-setup-result.json
          retention-days: 30
          if-no-files-found: warn
