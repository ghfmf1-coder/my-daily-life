name: Read-only verify Work registry coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/work-registry-readonly-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  workflow_run:
    workflows: ['Toolbox Google ownership and sitemap setup', 'Toolbox approved-site auto-deploy', 'Work twenty standalone preview sites', 'Work toolbox nine site builds and test deployments', 'Work shipping audit - tests and independent Pages deployment', 'Verify and deploy existing toolbox admin Worker']
    types: [completed]
concurrency:
  group: work-registry-readonly-audit
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read Cloudflare D1 service inventory without updating records
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          PAGES_INVENTORY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED: '["shipping-audit","invoice-reconcile","purchase-three-way","class-schedule-check","inventory-diff","certificate-batch","pdf-preflight","static-site-check","video-delivery-check","svg-laser-check","lease-registry-diff","webtoon-preflight","option-combinations","move-evidence","exam-variants","epub-preflight","silence-finder","photo-contact-sheet","survey-review","question-similarity","event-seating","photo-duplicates","audio-quality","detail-image-review","moving-boxes","tournament-maker","trip-supplies","shotlist-maker","show-cues","dst-embroidery"]'
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,datetime,re
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          if not account or not token:raise SystemExit('AUTH_BLOCKED: configure CLOUDFLARE_D1_READ_TOKEN with Account D1 Read only; keep Pages token unchanged')
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def call(path,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(base+path,data=body,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'Toolbox-Readonly-Audit'},method='POST' if payload is not None else 'GET')
              with urllib.request.urlopen(req,timeout=25) as resp:return json.loads(resp.read())
          try:
              verify=urllib.request.Request('https://api.cloudflare.com/client/v4/user/tokens/verify',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(verify,timeout=25) as resp:verified=json.loads(resp.read())
              if not verified.get('success') or verified.get('result',{}).get('status')!='active':raise SystemExit('AUTH_BLOCKED: read token not active')
              print('D1_READ_TOKEN_ACTIVE')
              inventory=call('/d1/database')
          except urllib.error.HTTPError as ex:
              raise SystemExit('REGISTRY_ACCESS_UNAVAILABLE: D1 list HTTP '+str(ex.code))
          if not inventory.get('success'):raise SystemExit('REGISTRY_ACCESS_UNAVAILABLE: D1 listing rejected')
          db=next((x for x in inventory.get('result',[]) if x.get('name')=='tb-admin-reporting'),None)
          if not db:raise SystemExit('REGISTRY_ACCESS_UNAVAILABLE: Work reporting database not listed')
          try:
              query=call('/d1/database/'+db['uuid']+'/query',{'sql':"SELECT service_id,canonical_url,cf_project,status FROM services WHERE status != 'verification_archived'"})
          except urllib.error.HTTPError as ex:
              raise SystemExit('REGISTRY_ACCESS_UNAVAILABLE: query HTTP '+str(ex.code))
          if not query.get('success'):raise SystemExit('REGISTRY_QUERY_FAILED')
          rows=(query.get('result') or [{}])[0].get('results') or []
          registered={r['cf_project'] for r in rows if r.get('status')!='verification_archived'}
          wanted={'tb-'+x for x in json.loads(os.environ['EXPECTED'])}
          new_wanted=set(wanted)
          pages_token=os.environ.get('PAGES_INVENTORY_TOKEN','')
          if not pages_token:raise SystemExit('PAGES_INVENTORY_TOKEN_MISSING')
          excluded={'tb-toolbox-admin','tb-toolbox-admin-rebuild','tb-toolbox-hub','tb-deployment-check','tb-naver-keyword-api'}
          deployed=set()
          for page in range(1,1001):
              request=urllib.request.Request(base+'/pages/projects?page='+str(page)+'&per_page=10',headers={'Authorization':'Bearer '+pages_token})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:page_data=json.loads(response.read())
              except urllib.error.HTTPError as error:raise SystemExit('PAGES_INVENTORY_HTTP_'+str(error.code))
              if not page_data.get('success'):raise SystemExit('PAGES_INVENTORY_REJECTED')
              projects=page_data.get('result',[])
              for project in projects:
                  name=project.get('name','');deployment=project.get('canonical_deployment') or {}
                  if name.startswith('tb-') and name not in excluded and deployment.get('environment')=='production' and (deployment.get('latest_stage') or {}).get('status')=='success' and not deployment.get('is_skipped'):deployed.add(name)
              if len(projects)<10:break
          else:raise SystemExit('PAGES_INVENTORY_TRUNCATED')
          wanted.update(deployed)
          missing=wanted-registered
          print('DISCOVERED_PRODUCTION_PAGES_PROJECTS:',len(deployed))
          print('REGISTERED_NEW_PUBLIC_SITES:',len(new_wanted & registered))
          print('MISSING_NEW_PROJECT_NAMES:',','.join(sorted(new_wanted-registered)) or 'NONE')
          def safe_url(value):
              try:
                  u=urllib.parse.urlsplit(value)
                  return u.scheme=='https' and not u.username and not u.password and not u.query and not u.fragment and (u.hostname=='abreda.com' or u.hostname.endswith('.abreda.com') or re.fullmatch(r'(tb-[a-z0-9-]+|my-daily-life)\.pages\.dev',u.hostname or ''))
              except (ValueError,AttributeError):return False
          for row in rows:
              url=row.get('canonical_url','')
              if safe_url(url):
                  print('PUBLIC_SERVICE:',json.dumps({k:row.get(k) for k in ('service_id','canonical_url','cf_project','status')},ensure_ascii=True))
          with open('/tmp/toolbox-public-urls.json','w') as output:json.dump({'urls':[r['canonical_url'] for r in rows if safe_url(r.get('canonical_url',''))]},output)
          duplicate_urls=len(rows)-len({r['canonical_url'] for r in rows})
          print('DUPLICATE_CANONICAL_URLS:',duplicate_urls)
          print('ACTIVE_LEDGER_SERVICE_COUNT:',len(rows))
          duplicate_ids=len(rows)-len({r['service_id'] for r in rows})
          print('DUPLICATE_SERVICE_IDS:',duplicate_ids)
          print('EXPECTED_NEW_PUBLIC_SITES:',len(new_wanted))
          print('ALL_EXPECTED_LINKED_PROJECTS:',len(wanted-missing))
          print('MISSING_PROJECT_NAMES:',','.join(sorted(missing)) or 'NONE')
          state=call('/d1/database/'+db['uuid']+'/query',{'sql':'SELECT source,last_check_at,status FROM report_sync ORDER BY source'})
          if not state.get('success'):raise SystemExit('SYNC_STATUS_QUERY_FAILED')
          sync_rows=(state.get('result') or [{}])[0].get('results',[])
          sync_failures=[]
          for row in sync_rows:
              print('SYNC_SOURCE_STATUS:',json.dumps({k:row.get(k) for k in ('source','last_check_at','status')},ensure_ascii=True))
              source=row.get('source')
              if source in ('CATALOG','GSC'):
                  try:
                      checked=datetime.datetime.fromisoformat(row['last_check_at'].replace('Z','+00:00'))
                      if checked.tzinfo is None:checked=checked.replace(tzinfo=datetime.timezone.utc)
                      age=(datetime.datetime.now(datetime.timezone.utc)-checked).total_seconds()
                      limit=900 if source=='CATALOG' else 32400
                      if age<0 or age>limit or row.get('status') not in ('ok','no_rows'):sync_failures.append(source)
                  except (KeyError,ValueError,TypeError):sync_failures.append(source)
          for source in ('CATALOG','GSC'):
              if not any(r.get('source')==source for r in sync_rows):sync_failures.append(source)
          metrics=call('/d1/database/'+db['uuid']+'/query',{'sql':"SELECT date,page_url,clicks,impressions FROM gsc_metrics WHERE date >= date('now','-28 days') AND page_url != '__PROPERTY__' ORDER BY date DESC,page_url"})
          if not metrics.get('success'):raise SystemExit('GSC_METRICS_QUERY_FAILED')
          metric_rows=(metrics.get('result') or [{}])[0].get('results',[])
          grouped={}
          for metric in metric_rows:
              url=metric.get('page_url','')
              if not safe_url(url):continue
              item=grouped.setdefault(url,{'clicks':0,'impressions':0,'firstDate':metric['date'],'lastDate':metric['date'],'rows':0})
              item['clicks']+=metric['clicks'];item['impressions']+=metric['impressions'];item['rows']+=1
              item['firstDate']=min(item['firstDate'],metric['date']);item['lastDate']=max(item['lastDate'],metric['date'])
          for url,item in sorted(grouped.items()):print('GSC_STORED_PAGE_METRICS:',json.dumps({'url':url,**item},ensure_ascii=True))
          print('GSC_STORED_PAGE_COUNT:',len(grouped))
          print('GSC_NO_ROW_MEANING: no stored page row is UNKNOWN, not zero traffic or confirmed non-indexing')
          print('SYNC_STALE_OR_ERROR_SOURCES:',','.join(sorted(set(sync_failures))) or 'NONE')
          print('D1_READ_TOKEN_EXPIRES_ON:',verified.get('result',{}).get('expires_on') or 'not_provided')
          print('GOOGLE_LIVE_OAUTH_VALIDITY: NOT_VERIFIED_BY_DATABASE_SNAPSHOT')
          print('SITEMAP_SUBMISSION_STATUS: NOT_VERIFIED')
          print('NAVER_CONNECTION_STATUS: NOT_VERIFIED')
          if missing:raise SystemExit('REGISTRY_SYNC_NOT_COMPLETE')
          if duplicate_urls:raise SystemExit('DUPLICATE_CANONICAL_URLS_FOUND')
          if duplicate_ids:raise SystemExit('DUPLICATE_SERVICE_IDS_FOUND')
          if sync_failures:raise SystemExit('SYNC_SOURCE_STALE_OR_ERROR')
          print('WORK_ADMIN_REGISTRY_SYNC_VERIFIED')
          snapshot={'entries':[{'serviceId':r['service_id'],'url':r['canonical_url'],'title':r.get('cf_project')} for r in rows if safe_url(r.get('canonical_url',''))],'sync':sync_rows,'gsc':[{'date':m['date'],'url':m['page_url'],'clicks':m['clicks'],'impressions':m['impressions']} for m in metric_rows],'ads':[]}
          with open('/tmp/toolbox-performance-source.json','w') as f:json.dump(snapshot,f)
          PY
      - name: Verify live Google connection ownership sitemaps and indexed URL reports
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          def read_json(request,timeout=25):
              try:
                  with urllib.request.urlopen(request,timeout=timeout) as response:return json.loads(response.read())
              except urllib.error.HTTPError as error:raise SystemExit('GOOGLE_BRIDGE_HTTP_'+str(error.code))
              except (TimeoutError,urllib.error.URLError):raise SystemExit('GOOGLE_BRIDGE_NETWORK_UNAVAILABLE')
          request_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote('small-toolbox-google-readonly',safe='')
          identity=read_json(urllib.request.Request(request_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}))
          identity_token=identity.get('value')
          if not identity_token:raise SystemExit('GITHUB_OIDC_UNAVAILABLE')
          payload=open('/tmp/toolbox-public-urls.json','rb').read()
          data=read_json(urllib.request.Request('https://ytifxhpizractdeytrok.supabase.co/functions/v1/toolbox-google-ads-oauth/reporting-github-data',data=payload,headers={'Authorization':'Bearer '+identity_token,'Content-Type':'application/json'},method='POST'),timeout=140)
          if data.get('status')!='ok':raise SystemExit('GOOGLE_LIVE_CHECK_FAILED')
          print('GOOGLE_LIVE_OAUTH_AND_SITES_API: OK')
          print('GOOGLE_GRANTED_CAPABILITIES:',json.dumps(data.get('capabilities',{}),sort_keys=True))
          print('GOOGLE_REPORT_GENERATED_AT:',data.get('generatedAt'))
          for site in data.get('sites',[]):print('GOOGLE_SITE_AUDIT:',json.dumps(site,ensure_ascii=True))
          gsc=data.get('gsc') or {}
          print('GOOGLE_LIVE_SEARCH_REPORT_STATUS:',gsc.get('status','unknown'))
          print('GOOGLE_LIVE_SEARCH_PERIOD:',data.get('start'),data.get('end'))
          for row in gsc.get('rows',[]):print('GOOGLE_LIVE_PAGE_METRICS:',json.dumps({k:row.get(k) for k in ('date','url','clicks','impressions','property')},ensure_ascii=True))
          missing=[s['url'] for s in data.get('sites',[]) if s.get('ownership')!='accessible']
          print('GOOGLE_PROPERTY_ACCESS_MISSING:',json.dumps(missing))
          print('GOOGLE_SITEMAP_SUBMISSION:',data.get('sitemapSubmission'))
          print('NAVER_STATUS:',data.get('naver'))
          print('INDEX_REPORT_LIMITATION:',data.get('inspectionMeaning'))
          if gsc.get('status') not in ('ok','no_rows'):raise SystemExit('GOOGLE_SEARCH_REPORT_UNAVAILABLE')
          if missing:raise SystemExit('GOOGLE_PROPERTY_ACCESS_MISSING')
          sitemap_failures=[s['url'] for s in data.get('sites',[]) if (s.get('sitemaps') or {}).get('status')=='query_failed']
          if sitemap_failures:raise SystemExit('GOOGLE_SITEMAP_QUERY_FAILED')
          print('GOOGLE_READONLY_AUDIT_COMPLETED')
          legacy=read_json(urllib.request.Request('https://ytifxhpizractdeytrok.supabase.co/functions/v1/toolbox-admin-legacy-read?date='+__import__('datetime').datetime.now(__import__('datetime').timezone(__import__('datetime').timedelta(hours=9))).date().isoformat(),headers={'Authorization':'Bearer '+identity_token}),timeout=60)
          with open('/tmp/toolbox-visit-source.json','w') as f:json.dump(legacy,f)
          print('GOOGLE_ADSENSE_SOURCE_STATUS:', (data.get('adsense') or {}).get('status','unverified'))
          print('VISIT_SOURCE_READ_VERIFIED:', isinstance(legacy.get('publicTraffic'),list) and isinstance(legacy.get('classifiedTraffic'),list))
          for row in legacy.get('publicTraffic',[]):print('VISIT_PUBLIC_DAILY:',json.dumps(row,ensure_ascii=True))
          PY
      - name: Verify production visitor tracking without generating visits
        run: python3 site-factory/ops/visit_coverage_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbox-visit-coverage
          path: /tmp/toolbox-visit-coverage.json
          retention-days: 30
          if-no-files-found: warn
      - name: Reconcile actual visit sources using the deployed reporting model
        run: node site-factory/admin-worker/verify-source-snapshot.mjs
